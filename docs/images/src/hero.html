<!doctype html>
<!--
  README banner. Render the light and dark versions (#dark picks the dark theme) with a
  Chromium-based browser, e.g.
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=960,400
           --default-background-color=00000000 --virtual-time-budget=5000
           --screenshot=hero-dark.png "file:///…/hero.html#dark"
  Everything shown is from the game: the sentence and its reference score are twist-010 in
  src/data/packs/twists.json, +125 is a perfect guess (100) with a 2-in-a-row combo (×1.25), and
  the chips are the five ways to play (MODE_INFO and the duo mode).
-->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>Word Net banner</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fb; --ink: #111827; --muted: #5b6475; --card: rgba(255,255,255,.78); --line: rgba(17,24,39,.08);
    --sad: #4f7cff; --calm: #8b5cf6; --warm: #ec4899; --happy: #f59e0b; --perfect: #047857; --perfect-dot: #10b981;
    --net: rgba(17,24,39,.06);
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 14px 40px -14px rgba(15,23,42,.22);
  }
  .dark {
    --bg: #070a16; --ink: #eef1ff; --muted: #a3abc2; --card: rgba(26,32,64,.62); --line: rgba(255,255,255,.09);
    --perfect: #34d399; --net: rgba(255,255,255,.05);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 50px -18px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { width: 960px; height: 400px; color: var(--ink);
         font-family: 'Space Grotesk', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif; }
  .frame { position: relative; width: 960px; height: 400px; border-radius: 24px; overflow: hidden; border: 1px solid var(--line);
           background: var(--bg); }
  /* No soft glows here: they band badly once the PNG is reduced to 256 colours. */
  .net { position: absolute; inset: 0; color: var(--net);
         background-image: repeating-linear-gradient(45deg, currentColor 0 1px, transparent 1px 28px),
                           repeating-linear-gradient(-45deg, currentColor 0 1px, transparent 1px 28px);
         -webkit-mask-image: radial-gradient(ellipse 75% 70% at 60% 30%, #000 10%, transparent 78%); }
  .mood { background: linear-gradient(90deg, var(--sad), var(--calm) 40%, var(--warm) 70%, var(--happy)); }
  .mood-text { background: linear-gradient(90deg, var(--sad), var(--calm) 40%, var(--warm) 70%, var(--happy));
               -webkit-background-clip: text; background-clip: text; color: transparent; }

  header { position: absolute; left: 44px; top: 40px; display: flex; align-items: center; gap: 18px; }
  .mark { width: 60px; height: 60px; border-radius: 17px; display: grid; place-items: center;
          box-shadow: 0 8px 22px -8px rgba(192,86,240,.6); }
  h1 { margin: 0; font-size: 46px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  .tag { margin: 9px 0 0; font-size: 19px; color: var(--muted); font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
  .tag b { color: var(--ink); }
  .tag b.mood-text { color: transparent; }
  .pill { position: absolute; right: 44px; top: 48px; font-family: Consolas, 'JetBrains Mono', monospace; font-size: 14px;
          padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  .pill span { color: var(--muted); margin-right: 8px; }
  .modes { position: absolute; left: 122px; top: 136px; display: flex; gap: 8px; font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
  .modes span { font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }

  .card { position: absolute; top: 184px; height: 180px; padding: 18px 20px; border-radius: 20px; background: var(--card);
          border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(12px);
          font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  #sentence { left: 44px; width: 250px; }
  #sentence p { margin: 16px 0 0; font-size: 23px; font-weight: 700; line-height: 1.45; }
  #sentence .chip { display: inline-block; margin-top: 12px; font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--line); color: var(--muted); }
  #cast { left: 344px; width: 290px; }
  .scale { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .scale .now { color: var(--ink); font-weight: 700; font-size: 15px; }
  .scale .end { display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .track { position: relative; height: 12px; border-radius: 99px; margin: 34px 14px 0; }
  .knot { position: absolute; top: 50%; width: 46px; height: 46px; border-radius: 50%; transform: translate(-50%, -50%);
          background: rgba(255,255,255,.25); border: 4px solid #fff; box-shadow: 0 8px 18px rgba(15,23,42,.3); overflow: hidden; }
  .knot svg { width: 100%; height: 100%; }
  .ref { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; transform: translate(-50%, -50%);
         background: var(--perfect-dot); border: 4px solid #fff; z-index: 2; }
  .refpill { position: absolute; top: 30px; transform: translateX(-50%); white-space: nowrap; font-family: 'Space Grotesk', sans-serif;
             font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #111827; color: #fff; }
  .dark .refpill { background: #fff; color: #111827; }
  #score { left: 684px; width: 232px; }
  #score .tier { margin: 14px 0 0; font-size: 34px; font-weight: 800; color: var(--perfect); }
  #score .pts { margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  #score .combo { font-size: 14px; font-weight: 700; color: #ea580c; }
  .dark #score .combo { color: #fdba74; }
  svg.wires { position: absolute; inset: 0; pointer-events: none; }
  .wire { fill: none; stroke: var(--muted); stroke-opacity: .55; stroke-width: 2; stroke-dasharray: 5 6; }
  .head { fill: var(--muted); fill-opacity: .7; }
</style>
</head>
<body>
<script>if (location.hash === '#dark') document.documentElement.className = 'dark';</script>
<div class="frame">
  <div class="net"></div>

  <header>
    <div class="mark mood">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
        <clipPath id="c"><circle cx="12" cy="12" r="8"/></clipPath>
        <g clip-path="url(#c)" stroke-opacity=".85"><path d="M0 6 18 24M0 12 12 24M6 0 24 18M12 0 24 12M0 0 24 24M24 6 6 24M24 12 12 24M18 0 0 18M12 0 0 12M24 0 0 24"/></g>
        <circle cx="12" cy="12" r="8" stroke-width="2"/>
      </svg>
    </div>
    <div>
      <h1>Word Net</h1>
      <p class="tag">讀一句話，猜它<b class="mood-text">有多開心</b>：撒網、揭曉、看你差多少。</p>
    </div>
  </header>

  <div class="pill"><span>$</span>npm run dev</div>
  <div class="modes"><span>經典</span><span>限時</span><span>生存</span><span>每日挑戰</span><span>雙人對戰</span></div>

  <svg class="wires" width="960" height="400">
    <path class="wire" d="M298 274 H334"/><path class="head" d="M340 274 l-9 -5 v10 z"/>
    <path class="wire" d="M638 274 H674"/><path class="head" d="M680 274 l-9 -5 v10 z"/>
  </svg>

  <div class="card" id="sentence">
    <div class="label">1　讀一句話</div>
    <p>這部電影好看到<br>我睡著了兩次。</p>
    <span class="chip">反諷</span>
  </div>

  <div class="card" id="cast">
    <div class="label">2　撒網，揭曉參考分數</div>
    <div class="scale"><span class="end" style="color: var(--sad)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="0.9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.9" fill="currentColor" stroke="none"/><path d="M9 17c1.8-2.2 4.2-2.2 6 0"/></svg> 難過</span><span class="now">有點難過 -0.45</span><span class="end" style="color: var(--happy)">開心 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="0.9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.9" fill="currentColor" stroke="none"/><path d="M9 15.5c1.8 2.2 4.2 2.2 6 0"/></svg></span></div>
    <div class="track mood">
      <div class="knot" style="left: 27.5%">
        <svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="1.4" stroke-opacity=".9">
          <path d="M0 8 32 40M0 20 20 40M8 0 40 32M20 0 40 20M0 0 40 40M40 8 8 40M40 20 20 40M32 0 0 32M20 0 0 20M40 0 0 40"/>
        </svg>
      </div>
      <div class="ref" style="left: 25%"></div>
      <div class="refpill" style="left: 25%">參考 -0.50</div>
    </div>
  </div>

  <div class="card" id="score">
    <div class="label">3　越接近分數越高</div>
    <p class="tier">完美！</p>
    <p class="pts">+125</p>
    <div class="combo">100 × 1.25 連擊</div>
  </div>
</div>
</body>
</html>
