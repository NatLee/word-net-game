<!DOCTYPE HTML>

<html>
	<head>
		<title>WordNet</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/sweetalert2.min.css">
		<link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.7.1/themes/base/jquery-ui.css" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<!--[if lte IE 9]><link rel="stylesheet" href="assets/css/ie9.css" /><![endif]-->
	</head>
	<body>

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header">
						<div class="logo">
							<span class="icon fa-comments"></span>
						</div>
						<div class="content">
							<div class="inner">
								<h1 id="count" style="text-align: center; background-color: rgba(217, 215, 213, 0.19); height:50px"></h1>
								<br>
								<h1 id='text'></h1>
								<br><br>
								<div>
									<div style="width: 20%; float: left"><img src="images/sad.png" width="60%" height="60%" ></div>
									<div id="slider-range-max" style="width: 60%; float: left"></div>
									<div style="width: 20%; float: left"><img src="images/smile.png" width="60%" height="60%" ></div>
								</div>
								<div class="group">
									<br><br><br>
									<input type="text" id="userName" required style="width: 40%; margin: 0 auto;">
									<span class="highlight"></span>
									<span class="bar"></span>
									<label>輸入你的名字</label>
								</div>
							</div>
						</div>
						<nav>
							<ul>
								<li><a id="submit" onclick="clickEvent(this)">送出(Submit)</a></li>
								<li><a id="details" onclick="detailsEvent(this)">說明(Details)</a></li>
								<li><a href="#rank">排行(Ranking)</a></li>
							</ul>
						</nav>
					</header>

				<!-- Main -->
					<div id="main">
						<!-- rank -->
							<article id="rank">
								<section>
								    <h1 class="major">Rank</h1>
								    <div class='tbl-header'>
								        <table cellpadding='0' cellspacing='0' border='0'>
								            <thead>
								                <tr><th>Name</th><th>Count</th></tr>
								            </thead>
								        </table>
								    </div>
								    <div class='tbl-content' style='height: 60%'>
								        <table cellpadding='0' cellspacing='0' border='0'>
								            <tbody>
								            </tbody>
								        </table>
								    </div>
								</section>
							</article>
					</div>

			</div>

		<!-- BG -->
			<div id="bg"></div>

		<!-- Scripts -->
			<script src="assets/js/sweetalert2.all.min.js"></script>
			<script type="text/javascript" src="https://code.jquery.com/jquery-1.7.2.min.js"></script>
			<script src="assets/js/skel.min.js"></script>
			<script src="https://code.jquery.com/ui/1.8.21/jquery-ui.min.js"></script>
			<script src="assets/js/jquery.ui.touch-punch.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
			<script src="assets/js/index.js"></script>
			<script src="assets/js/rank.js"></script>

	</body>
</html>
