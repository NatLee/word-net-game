name: Deploy to GitHub Pages

# Builds the game and publishes it with GitHub Pages from the default branch.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    # Pushes to other branches start a run that skips straight away.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Read the Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Type-check and build
        run: npm run build
        env:
          # "/<repo>" for project sites, "" for <user>.github.io or a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # One deployment at a time; a newer one waits instead of cancelling a running deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
